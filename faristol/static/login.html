<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Faristol · Inicia sessió</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --radius-md: 6px;
            --radius-lg: 8px;
            --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --bg-surface: #1e293b;
                --border-color: #334155;
                --text-main: #f1f5f9;
                --text-muted: #94a3b8;
                --accent: #3b82f6;
                --accent-hover: #60a5fa;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: var(--font-ui);
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 360px;
            padding: 28px 24px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .brand i { font-style: normal; font-size: 26px; }
        .brand h1 { font-size: 20px; margin: 0; letter-spacing: 0.3px; }
        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0 0 22px 0;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-main);
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        button {
            width: 100%;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
        }
        button:hover { background: var(--accent-hover); }
        .error {
            display: none;
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid var(--danger);
            color: var(--danger);
            font-size: 13px;
            padding: 9px 11px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }
        .error.visible { display: block; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <i>📖</i>
            <h1>Faristol</h1>
        </div>
        <p class="subtitle">Banc de treball de lectura i síntesi bibliogràfica</p>

        <div class="error" id="error" role="alert">Usuari o contrasenya incorrectes.</div>

        <form method="post" action="/login" autocomplete="on">
            <label for="username">Usuari</label>
            <input type="text" id="username" name="username" autocomplete="username"
                   autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>

            <label for="password">Contrasenya</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Inicia sessió</button>
        </form>
    </main>

    <script>
        // Mostra l'error si venim d'un intent fallit (?error=1)
        if (new URLSearchParams(window.location.search).has('error')) {
            document.getElementById('error').classList.add('visible');
        }
    </script>
</body>
</html>
