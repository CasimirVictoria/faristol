[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faristol"
version = "1.0.0"
description = "Faristol: Banc de treball lliure per a la lectura, anotació de PDFs i síntesi bibliogràfica"
readme = "README.md"
authors = [
    { name = "Casimir" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.6"
]

[project.scripts]
faristol = "faristol.bin.faristol:main"
plec = "faristol.bin.faristol:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["faristol*"]

[tool.setuptools.package-data]
"faristol" = ["static/**/*"]

